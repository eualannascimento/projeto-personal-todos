# Workflow de sincronização com Notion
# Executa periodicamente e busca tarefas do Notion
#
# SEGURANÇA:
# - NOTION_TOKEN e NOTION_DATABASE_ID são armazenados como GitHub Secrets
# - Nunca são expostos em logs ou no código
# - O JSON gerado contém apenas dados públicos das tarefas

name: Sync Notion

on:
  # Executa a cada 15 minutos
  schedule:
    - cron: '*/15 * * * *'

  # Permite execução manual
  workflow_dispatch:

  # Executa quando há push na main (para manter dados atualizados após deploy)
  push:
    branches:
      - main
    paths-ignore:
      - 'public/data/**'

# Permissões necessárias
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run sync script
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: node scripts/sync-notion.mjs

      - name: Check for changes
        id: check_changes
        run: |
          git add public/data/
          if git diff --staged --quiet; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -m "chore: sync tasks from Notion [skip ci]"
          git push
